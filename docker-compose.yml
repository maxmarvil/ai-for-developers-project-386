version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: booking_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - booking_network

  redis:
    image: redis:7-alpine
    container_name: booking_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - booking_network

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    container_name: booking_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    networks:
      - booking_network
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: booking_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - booking_network
    depends_on:
      - php

  adminer:
    image: adminer
    container_name: booking_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - booking_network
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  booking_network:
    driver: bridge
